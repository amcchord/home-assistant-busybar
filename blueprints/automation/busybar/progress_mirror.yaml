blueprint:
  name: BUSY Bar — Progress mirror
  description: Mirror a numeric entity such as an EV, 3D printer, download, chore, or appliance percentage.
  domain: automation
  input:
    busybar_device:
      name: BUSY Bar
      selector:
        device:
          integration: busybar
    progress_entity:
      name: Progress entity
      selector:
        entity:
          domain:
            - sensor
            - number
    label:
      name: Label
      default: "PROGRESS"
      selector:
        text:

triggers:
  - trigger: state
    entity_id: !input progress_entity

conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state | float(none) is not none }}"

actions:
  - action: busybar.show_progress
    data:
      device_id: !input busybar_device
      value: "{{ trigger.to_state.state | float(0) }}"
      label: !input label
      color: [34, 211, 238]
      duration: 30
      priority: 40

mode: restart
