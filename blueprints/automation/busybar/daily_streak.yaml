blueprint:
  name: BUSY Bar — Daily streak
  description: Celebrate and display a streak or household-points sensor when it changes.
  domain: automation
  input:
    busybar_device:
      name: BUSY Bar
      selector:
        device:
          integration: busybar
    streak_entity:
      name: Streak or points sensor
      selector:
        entity:
          domain: sensor
    label:
      name: Label
      default: "DAILY STREAK"
      selector:
        text:
    unit:
      name: Unit
      default: "DAYS"
      selector:
        text:

triggers:
  - trigger: state
    entity_id: !input streak_entity

conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state | float(none) is not none }}"

actions:
  - action: busybar.show_widget
    data:
      device_id: !input busybar_device
      widget: streak
      title: !input label
      value: "{{ trigger.to_state.state | round(0) }}"
      unit: !input unit
      color: [244, 114, 182]
      duration: 30
      priority: 45
      restore: true

mode: restart
